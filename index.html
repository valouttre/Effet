<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Music Tap Rush</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080812;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;gap:10px}
.title{font-size:22px;font-weight:900;letter-spacing:.3px}
.stats{display:flex;gap:8px}
.stat{background:#151527;border:1px solid #2b2b45;border-radius:14px;padding:7px 10px;text-align:center;min-width:62px}
.stat b{display:block;font-size:17px}.stat span{font-size:10px;opacity:.6;text-transform:uppercase}
#arena{position:relative;flex:1;border-radius:26px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#22234a 0,#101124 42%,#07070e 100%);border:1px solid #292945}
#arena:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
#target{position:absolute;width:74px;height:74px;border-radius:50%;display:none;transform:translate(-50%,-50%);background:radial-gradient(circle,#fff 0 8%,#75e8ff 9% 32%,#6d52ff 33% 62%,#b02cff 63% 100%);box-shadow:0 0 18px #7c55ff,0 0 50px #5b38ff88;z-index:3}
#target:after{content:"";position:absolute;inset:-9px;border:3px solid #ffffff88;border-radius:50%;animation:shrink .8s linear forwards}
@keyframes shrink{to{transform:scale(.15);opacity:.1}}
#message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:2}
.card{max-width:340px;background:#111123dd;border:1px solid #30304d;border-radius:24px;padding:24px;backdrop-filter:blur(12px)}
.card h1{margin:0 0 8px;font-size:30px}.card p{opacity:.72;line-height:1.45;margin:8px 0 18px}
button{border:0;color:#fff;background:linear-gradient(135deg,#6b55ff,#a42cff);font-weight:900;font-size:16px;border-radius:16px;padding:14px 20px;min-height:50px}
button:active{transform:scale(.97)}
#bottom{padding:12px 0 14px;display:flex;gap:9px}
#file{display:none}
.small{flex:1;background:#151527;border:1px solid #2b2b45}
#play{flex:1.2}
#musicName{font-size:12px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;padding:2px 0 8px}
#progress{height:4px;background:#202036;border-radius:4px;overflow:hidden;margin:0 0 5px}
#bar{height:100%;width:0;background:#8c63ff}
.hit{position:absolute;color:#fff;font-weight:900;font-size:25px;pointer-events:none;animation:hit .45s ease-out forwards;z-index:5;text-shadow:0 0 15px #fff}
@keyframes hit{0%{transform:translate(-50%,-50%) scale(.7);opacity:1}100%{transform:translate(-50%,-100px) scale(1.15);opacity:0}}
#bpm{font-size:11px;opacity:.55;text-align:center}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="title">🎵 Music Tap Rush</div>
  <div class="stats">
    <div class="stat"><b id="score">0</b><span>Score</span></div>
    <div class="stat"><b id="combo">0</b><span>Combo</span></div>
    <div class="stat"><b id="best">0</b><span>Best</span></div>
  </div>
</header>
<div id="musicName">Aucune musique importée</div>
<div id="progress"><div id="bar"></div></div>
<div id="bpm">BPM : —</div>
<section id="arena">
  <div id="message">
    <div class="card">
      <h1>Prêt ? ⚡</h1>
      <p>Importe une musique, puis touche les cibles le plus vite possible au rythme.</p>
      <button id="importBtn">🎵 Importer une musique</button>
    </div>
  </div>
  <div id="target"></div>
</section>
<div id="bottom">
  <button class="small" id="fileBtn">📂 Musique</button>
  <button id="play" disabled>▶️ Jouer</button>
  <input id="file" type="file" accept="audio/*">
</div>
<audio id="audio" preload="auto"></audio>
</div>
<script>
const fileInput=document.getElementById('file'), fileBtn=document.getElementById('fileBtn'), importBtn=document.getElementById('importBtn');
const playBtn=document.getElementById('play'), audio=document.getElementById('audio'), arena=document.getElementById('arena'), target=document.getElementById('target');
const msg=document.getElementById('message'), scoreEl=document.getElementById('score'), comboEl=document.getElementById('combo'), bestEl=document.getElementById('best'), bpmEl=document.getElementById('bpm'), nameEl=document.getElementById('musicName'), bar=document.getElementById('bar');
let score=0,combo=0,best=Number(localStorage.getItem('mtr_best')||0),running=false,lastBeat=-1,beatTimer=null, bpm=120, objectUrl=null, ctx=null, source=null, analyser=null;
bestEl.textContent=best;

function openFile(){fileInput.click()}
fileBtn.onclick=openFile; importBtn.onclick=openFile;

fileInput.onchange=async e=>{
 const f=e.target.files[0]; if(!f)return;
 if(objectUrl)URL.revokeObjectURL(objectUrl);
 objectUrl=URL.createObjectURL(f); audio.src=objectUrl; audio.load();
 nameEl.textContent=f.name;
 bpm=await estimateBPM(f);
 bpmEl.textContent='BPM : '+Math.round(bpm)+' • auto';
 playBtn.disabled=false; msg.innerHTML='<div class="card"><h1>Musique prête 🎵</h1><p>BPM détecté : <b>'+Math.round(bpm)+'</b><br>Touche Jouer pour commencer.</p><button onclick="startGame()">▶️ Jouer</button></div>';
};

async function estimateBPM(file){
 // Lightweight local estimate using Web Audio. It never uploads the music.
 try{
   const ac=new (window.AudioContext||window.webkitAudioContext)();
   const buf=await ac.decodeAudioData(await file.arrayBuffer());
   const data=buf.getChannelData(0), sr=buf.sampleRate;
   const step=Math.max(1,Math.floor(sr/100)); let env=[];
   for(let i=0;i<data.length;i+=step){
     let sum=0, end=Math.min(i+step,data.length);
     for(let j=i;j<end;j++)sum+=data[j]*data[j];
     env.push(Math.sqrt(sum/(end-i)));
   }
   const avg=env.reduce((a,b)=>a+b,0)/env.length;
   const threshold=avg*1.55, peaks=[];
   let last=-999;
   for(let i=2;i<env.length-2;i++){
     if(env[i]>threshold && env[i]>=env[i-1] && env[i]>=env[i+1]){
       const t=i*(step/sr);
       if(t-last>.22){peaks.push(t);last=t}
     }
   }
   if(peaks.length>5){
     const diffs=[]; for(let i=1;i<peaks.length;i++)diffs.push(peaks[i]-peaks[i-1]);
     diffs.sort((a,b)=>a-b); const med=diffs[Math.floor(diffs.length/2)];
     let out=60/med; while(out<70)out*=2; while(out>180)out/=2;
     await ac.close(); return Math.max(70,Math.min(180,out));
   }
   await ac.close();
 }catch(e){}
 return 120;
}

function reset(){score=0;combo=0;scoreEl.textContent=0;comboEl.textContent=0;lastBeat=-1}
function startGame(){
 if(!audio.src)return;
 reset(); running=true; msg.style.display='none'; target.style.display='block';
 audio.currentTime=0; audio.play().catch(()=>{});
 scheduleTarget(true);
}
function scheduleTarget(initial=false){
 if(!running)return;
 const beat=60/bpm;
 const delay=initial?80:Math.max(180,beat*1000*(.75-Math.min(combo,30)*.008));
 clearTimeout(beatTimer); beatTimer=setTimeout(()=>{spawn();scheduleTarget()},delay);
}
function spawn(){
 if(!running)return;
 const r=38, w=arena.clientWidth, h=arena.clientHeight;
 const x=r+Math.random()*(w-r*2), y=r+Math.random()*(h-r*2);
 target.style.left=x+'px';target.style.top=y+'px';
 target.dataset.t=performance.now();
 target.style.setProperty('--life',Math.max(350,750-combo*8)+'ms');
 target.querySelector?.('x');
 target.classList.remove('dummy'); void target.offsetWidth;
}
function tap(x,y){
 if(!running)return;
 const rect=arena.getBoundingClientRect(), tx=Number.parseFloat(target.style.left), ty=Number.parseFloat(target.style.top);
 const dx=x-rect.left-tx,dy=y-rect.top-ty;
 if(Math.hypot(dx,dy)<=48 && target.style.display!=='none'){
   const reaction=Math.max(0,performance.now()-Number(target.dataset.t||performance.now()));
   combo++; score+=100+Math.max(0,100-Math.floor(reaction/5))+combo*5;
   scoreEl.textContent=score;comboEl.textContent=combo;
   if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('mtr_best',best)}
   const h=document.createElement('div');h.className='hit';h.textContent='+'+(100+combo*5);h.style.left=(tx)+'px';h.style.top=(ty)+'px';arena.appendChild(h);setTimeout(()=>h.remove(),450);
   spawn();
 }else{
   combo=0;comboEl.textContent=0;
 }
}
arena.addEventListener('pointerdown',e=>tap(e.clientX,e.clientY),{passive:true});
audio.addEventListener('timeupdate',()=>{if(audio.duration)bar.style.width=(audio.currentTime/audio.duration*100)+'%'});
audio.addEventListener('ended',endGame);
function endGame(){
 running=false;clearTimeout(beatTimer);target.style.display='none';msg.style.display='flex';
 msg.innerHTML='<div class="card"><h1>Fin de partie 🏆</h1><p>Score : <b>'+score+'</b><br>Meilleur score : <b>'+best+'</b></p><button onclick="startGame()">🔄 Rejouer</button></div>';
}
window.startGame=startGame;
</script>
</body>
</html>
